<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHÚC MỪNG NGÀY PHỤ NỮ VIỆT NAM</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            transition: background 0.5s ease-in-out;
            transform: translateY(40px);
        }

        .button-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #ff69b4;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background-color 0.3s;
        }

        button:hover {
            background-color: #ff1493;
            transform: scale(1.05);
        }

        .video-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.9);
            flex-direction: column;
        }

        video {
            width: 90%;
            max-width: 800px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .back-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background-color: #fff;
            color: #ff69b4;
            cursor: pointer;
            transition: background 0.3s;
        }

        .back-button:hover {
            background-color: #ffe6f0;
        }
    </style>
</head>
<body>
    <div class="button-container" id="menu">
        <button onclick="showVideo('video-anh.mp4')">Quà tặng Ánh</button>
        <button onclick="showVideo('video-gia-dinh.mp4')">Quà tặng gia đình</button>
    </div>

    <div class="video-container" id="videoContainer">
        <video id="giftVideo" controls></video>
        <button class="back-button" onclick="goBack()">Quay lại</button>
    </div>

    <script>
        function showVideo(videoSrc) {
            const menu = document.getElementById('menu');
            const videoContainer = document.getElementById('videoContainer');
            const videoElement = document.getElementById('giftVideo');

            menu.style.display = 'none';
            videoContainer.style.display = 'flex';
            document.body.style.background = 'black';

            videoElement.src = videoSrc;
            videoElement.play();
        }

        function goBack() {
            const menu = document.getElementById('menu');
            const videoContainer = document.getElementById('videoContainer');
            const videoElement = document.getElementById('giftVideo');

            videoElement.pause();
            videoElement.currentTime = 0;
            videoContainer.style.display = 'none';
            menu.style.display = 'flex';
            document.body.style.background = "url('background.png') no-repeat center center fixed";
            document.body.style.backgroundSize = "cover";
        }
    </script>
</body>
</html>
